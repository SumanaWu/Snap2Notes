<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snap2Notes</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/vendor/katex.min.css"></head>
<body><header><div class="brand"><span class="mark">S</span><span>Snap2Notes</span></div><select id="history" aria-label="打开历史笔记"><option value="">打开历史笔记</option></select></header>
<main><section class="intro"><p class="eyebrow">PHOTO TO NOTES</p><h1>把课堂内容，<br><em>整理成笔记。</em></h1><p>上传黑板、白板或手写笔记照片，对照原图校订文字，再导出为你需要的格式。</p></section>
<section class="upload-panel"><div><h2>添加照片</h2><p>支持 JPG、PNG 和 HEIC，可一次选择多张。可以在上传前调整顺序。</p></div><label class="upload-button">选择照片<input id="files" type="file" accept="image/jpeg,image/png,image/heic,image/heif" multiple hidden></label><div id="selected" class="selected">尚未选择照片</div><label class="board-option"><input id="same-board" type="checkbox"> 这些照片拍自同一块板</label><button id="start" disabled>开始识别 <span>↗</span></button><p id="status" role="status" class="status"></p></section>
<section class="workspace" id="workspace" hidden><div class="workspace-head"><div><p class="eyebrow">YOUR WORKSPACE</p><h2>校订笔记</h2><p>识别框会显示在原图上，点击框可查看对应文字。</p></div><div class="actions"><button class="secondary" id="save">保存修改</button><select id="format" aria-label="导出格式"><option value="md">Markdown</option><option value="tex">LaTeX</option><option value="docx">Word</option><option value="pdf">PDF</option></select><button id="export">导出</button></div></div><div class="columns"><div class="source"><div class="pane-title"><strong>原始照片</strong><select id="page" aria-label="选择照片"></select></div><div class="image-area"><div class="image-wrap"><img id="image" alt="上传的笔记照片"><svg id="boxes" aria-label="识别区域"></svg></div></div><div class="region-actions"><button id="retry" class="secondary">重试本页</button><button id="corners" class="secondary">标记四角</button><select id="region-kind" aria-label="补圈内容类型"><option value="formula">公式</option><option value="figure">图形</option><option value="text">文字</option></select><button id="region" class="secondary">补圈</button><button id="find-formulas" class="secondary">查找公式候选</button><button id="accept-formula" class="secondary" hidden>识别选中候选</button></div><p id="block-info" class="hint">选择识别框查看文字</p></div><div class="editor"><div class="pane-title"><strong>笔记内容</strong><span>Markdown</span></div><textarea id="markdown" spellcheck="false" aria-label="编辑笔记内容" placeholder="识别结果将出现在这里"></textarea><div class="region-actions"><label><input id="confirmed" type="checkbox"> 已确认内容</label><button id="summary" class="secondary">查看原文摘录</button><button id="draft" class="secondary">插入识别稿</button></div><div id="excerpts" class="region-actions"></div><div id="math-preview" class="hint"></div><p class="hint">可以直接修改文字，公式可用 $...$ 或 $$...$$ 输入。</p></div></div></section></main><script src="/static/vendor/katex.min.js"></script><script src="/static/app.js"></script></body></html>
